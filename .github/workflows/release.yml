# Publishes to npm when a version tag is pushed: `git push origin v0.12.0`.
#
# No npm token is stored anywhere. npm trusts this workflow directly
# ("trusted publishing"), which has to be switched on once at npmjs.com after
# the first publish. PUBLISHING.md has the steps. Every release published this
# way carries a provenance statement linking it to this repo and commit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi
      # prepublishOnly runs the full check before anything is uploaded. A
      # prerelease (0.13.0-beta.1) goes out under "next", so a plain install
      # keeps getting the last stable release.
      - name: Publish
        run: |
          if node -p 'require("./package.json").version' | grep -q -- '-'; then
            npm publish --provenance --tag next
          else
            npm publish --provenance
          fi
